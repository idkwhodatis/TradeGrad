name: V1 staged validation

on:
  workflow_dispatch:
    inputs:
      provider_mode:
        description: "fixture is deterministic; live explicitly checks public upstreams without fallback"
        required: true
        default: fixture
        type: choice
        options: [fixture, live]
  push:
    branches: ["feat/webui-v1"]
  pull_request:
    paths:
      - "src/**"
      - "script/**"
      - "tests/**"
      - "backend/**"
      - "frontend/**"
      - "workers/**"
      - "runtimes/**"
      - "packages/**"
      - "infra/**"
      - "requirements*.txt"
      - ".github/workflows/v1-validation.yml"

permissions:
  contents: read

concurrency:
  group: v1-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: M0 four-task engine and semantics
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TRADEGRAD_WORKERS: "1"
      TRADEGRAD_DATA_WORKERS: "1"
      TRADEGRAD_LLM_WORKERS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install the frozen research baseline
        run: python -m pip install -r tests/baseline/requirements.lock
      - name: Execute actual AKQuant baseline and regression tests
        run: python -m pytest tests/baseline -q --junitxml=m0-junit.xml
      - name: Validate actual native four-task bundles and bounded result transport
        run: python -m pytest tests/tradegrad/test_results.py tests/tradegrad/test_results_entrypoint.py tests/runner/test_research_result_protocol.py -q --junitxml=m3-native-junit.xml
      - name: Export outcome-only baseline evidence
        if: always()
        run: python script/summarize_ci_junit.py m0-junit.xml m3-native-junit.xml
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m0-validation-${{ github.sha }}
          path: var/ci-evidence/*.xml
          retention-days: 14

  application:
    name: M1–M5 real application (${{ (inputs.provider_mode == 'live' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-data]'))) && 'live' || 'fixture' }})
    needs: baseline
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      # Credentials are generated and masked on this disposable runner only.
      POSTGRES_USER: tradegrad_ci
      POSTGRES_DB: tradegrad_ci
      STORAGE_ROOT: ${{ github.workspace }}/var/storage
      TRADEGRAD_RUNNER_STATE_DIR: ${{ github.workspace }}/var/runner
      EVALUATOR_IMAGE: tradegrad-evaluator:v1
      PORTABLE_ENGINE_IMAGE: tradegrad-portable-engine:v1
      PORTABLE_POLICY_IMAGE: tradegrad-portable-policy:v1
      TRADEGRAD_REQUIRE_DOCKER: "1"
      E2E_EMAIL: first@example.com
      E2E_OTHER_EMAIL: second@example.com
      WORKER_CONCURRENCY: "1"
      DATA_WORKER_CONCURRENCY: "1"
      # Ordinary pushes freeze SDK responses. Live requires explicit dispatch or
      # a [live-data] feature-branch commit marker; no default-branch change needed.
      DATA_PROVIDER_MODE: ${{ (inputs.provider_mode == 'live' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-data]'))) && 'live' || 'fixture' }}
      E2E_LIVE_PROVIDERS: ${{ (inputs.provider_mode == 'live' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-data]'))) && '1' || '0' }}
      HEARTBEAT_SECONDS: "1"
      LEASE_SECONDS: "20"
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate masked job-local fixture credentials
        run: python script/ci_test_environment.py
      - name: Start authenticated disposable PostgreSQL on loopback only
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name tradegrad-ci-postgres \
            --label io.tradegrad.ci=postgres --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER --env POSTGRES_PASSWORD --env POSTGRES_DB \
            --tmpfs /var/lib/postgresql:rw,size=1g,nosuid \
            --health-cmd 'pg_isready -U tradegrad_ci -d tradegrad_ci' \
            --health-interval 2s --health-timeout 5s --health-retries 30 postgres:18.6
          for attempt in $(seq 1 90); do
            state=$(docker inspect --format '{{.State.Health.Status}}' tradegrad-ci-postgres)
            if [ "$state" = healthy ]; then exit 0; fi
            if [ "$state" = unhealthy ]; then break; fi
            sleep 1
          done
          echo 'Disposable PostgreSQL did not become healthy' >&2
          exit 1
      - name: Install separately locked API runtime
        run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Install separately hash-locked data worker and generate lean OpenBB client
        run: |
          python -m venv .venv-data
          .venv-data/bin/python -m pip install --require-hashes -r runtimes/data/requirements.lock
          .venv-data/bin/openbb-build
          python -m script.validate_runtime_split --runtime api
          .venv-data/bin/python -m script.validate_runtime_split --runtime data
      - name: Install separately hash-locked trusted research runtime
        run: |
          python -m venv .venv-research
          .venv-research/bin/python -m pip install --require-hashes -r runtimes/research/requirements.lock
          .venv-research/bin/python -m script.validate_runtime_split --runtime research
      - name: Validate immutable windows, actual TradeTGD and crash-recovery contracts
        run: .venv-research/bin/python -m pytest tests/tradegrad --ignore=tests/tradegrad/test_results.py --ignore=tests/tradegrad/test_results_entrypoint.py --ignore=tests/tradegrad/test_window_engine_bridge.py --ignore=tests/tradegrad/test_result_views_native.py -q --junitxml=m3-research-contracts-junit.xml
      - name: Install pinned engine for SHA-pinned original-seed adapter bridges
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r runtimes/evaluator/requirements.lock
      - name: Verify configured warm-up staging against actual original-seed engine
        env:
          TRADEGRAD_LOCAL_ENGINE_BRIDGE: "1"
        run: .venv-research/bin/python -m pytest tests/tradegrad/test_window_engine_bridge.py tests/tradegrad/test_result_views_native.py -q --junitxml=m3-window-engine-junit.xml
      - name: Validate actual SDK schemas and deterministic normalization contracts
        env:
          TRADEGRAD_LOCAL_ENGINE_BRIDGE: "1"
        run: .venv-data/bin/python -m pytest tests/marketdata -q --ignore=tests/marketdata/test_live_providers.py -k "not optional_live" --junitxml=m2-data-contracts-junit.xml
      - name: Explicit scoped live-provider smoke (no fixtures or fallback)
        if: env.DATA_PROVIDER_MODE == 'live'
        env:
          TRADEGRAD_MARKETDATA_LIVE: "1"
          TRADEGRAD_OPENBB_LIVE: "1"
        run: .venv-data/bin/python -m pytest tests/marketdata/test_live_providers.py tests/marketdata/test_openbb.py -q -k "test_live_resolve_fetch_and_snapshot or optional_live" --junitxml=m2-live-provider-junit.xml
      - name: Validate portable SDK, actual TradeTGD adapter and frozen final contracts
        run: .venv-research/bin/python -m pytest tests/portable --ignore=tests/portable/test_isolation.py -q --junitxml=m5-portable-contracts-junit.xml
      - name: Validate portable calendar semantics with installed pinned calendar library
        run: .venv-data/bin/python -m pytest tests/portable/test_engine.py -q --junitxml=m5-portable-calendar-junit.xml
      - name: Validate supervisor contracts
        run: python -m pytest backend/tests tests/runner --ignore=tests/runner/test_research_result_protocol.py -q --junitxml=m1-supervisor-junit.xml
      - name: Validate real PostgreSQL transactions and Procrastinate schema
        run: .venv-data/bin/python -m pytest tests/integration -q --junitxml=m1-m2-postgres-junit.xml
      - name: Build local evaluator image (never published)
        run: |
          digest=$(python -m packages.tradegrad_adapter.environment)
          docker build --build-arg "TRADEGRAD_ENVIRONMENT_DIGEST=$digest" -t "$EVALUATOR_IMAGE" -f runtimes/evaluator/Dockerfile .
      - name: Build separate trusted-engine and untrusted-policy images (never published)
        run: |
          digest=$(.venv-research/bin/python -m packages.tradegrad_adapter.portable_environment)
          echo "PORTABLE_ENVIRONMENT_DIGEST=$digest" >> "$GITHUB_ENV"
          docker build --build-arg "TRADEGRAD_ENVIRONMENT_DIGEST=$digest" -t "$PORTABLE_ENGINE_IMAGE" -f runtimes/portable_engine/Dockerfile .
          docker build --build-arg "TRADEGRAD_ENVIRONMENT_DIGEST=$digest" -t "$PORTABLE_POLICY_IMAGE" -f runtimes/portable_policy/Dockerfile .
      - name: Require real paired-container portable isolation and causal execution
        env:
          TRADEGRAD_REQUIRE_PORTABLE_DOCKER: "1"
        run: python -m pytest tests/portable/test_isolation.py -q --junitxml=m5-portable-isolation-junit.xml
      - name: Require real kernel isolation and unchanged four-task engine results
        run: python -m pytest tests/isolation -q --junitxml=m1-isolation-junit.xml
      - name: Install frontend and verify generated contracts
        run: |
          python -m backend.app.export_openapi
          npm ci --prefix frontend
          npm run generate-client --prefix frontend
          git diff --exit-code -- packages/contracts frontend/src/client
          npm run format:check --prefix frontend
          npm run typecheck --prefix frontend
          npm test --prefix frontend
          npm run build --prefix frontend
      - name: Install matched Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Migrate and explicitly provision disposable synthetic accounts
        id: application_ready
        run: |
          python -m script.provision_storage --root "$STORAGE_ROOT" --durable-parent "$GITHUB_WORKSPACE"
          alembic -c backend/alembic.ini upgrade head
          python -m backend.app.bootstrap --email "$E2E_EMAIL" --password-env E2E_PASSWORD --with-synthetic-fixtures --with-e2e-fixtures
          python -m backend.app.bootstrap --email "$E2E_OTHER_EMAIL" --password-env E2E_OTHER_PASSWORD --with-synthetic-fixtures
      - name: Verify real research/data worker SIGKILL and checkpoint recovery
        id: acceptance_01
        if: ${{ !cancelled() && steps.application_ready.outcome == 'success' }}
        env:
          TRADEGRAD_REQUIRE_PROCESS_RECOVERY: "1"
          TRADEGRAD_REQUIRE_DATA_PROCESS_RECOVERY: "1"
          DATA_PYTHON: ${{ github.workspace }}/.venv-data/bin/python
        run: |
          set +e
          python -m pytest tests/system -q --junitxml=m1-m2-process-recovery-junit.xml
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Confirm isolated fixture teardown before the next acceptance group
        id: acceptance_01_boundary
        if: ${{ !cancelled() && steps.acceptance_01.outcome != 'skipped' }}
        run: >-
          python -m script.ci_acceptance_boundary m1-m2-process-recovery-junit.xml
          "${{ steps.acceptance_01.outcome }}" "${{ steps.acceptance_01.outputs.exit_code }}"
          "test_two_concurrent_runs_recover_after_real_workers_are_sigkilled,test_sigkill_reuses_checkpoints_then_original_us_seed_runs_in_real_docker"
      - name: Verify configured optimization against real PostgreSQL and Docker
        id: acceptance_02
        if: ${{ !cancelled() && steps.acceptance_01_boundary.outcome == 'success' }}
        env:
          TRADEGRAD_REQUIRE_RESEARCH_INTEGRATION: "1"
          DATA_PYTHON: ${{ github.workspace }}/.venv-data/bin/python
          RESEARCH_PYTHON: ${{ github.workspace }}/.venv-research/bin/python
        run: |
          export API_PYTHON=$(command -v python)
          set +e
          .venv-research/bin/python -m pytest tests/system/test_research_optimization.py -q --junitxml=m3-configured-application-junit.xml
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Confirm isolated fixture teardown before the next acceptance group
        id: acceptance_02_boundary
        if: ${{ !cancelled() && steps.acceptance_02.outcome != 'skipped' }}
        run: >-
          python -m script.ci_acceptance_boundary m3-configured-application-junit.xml
          "${{ steps.acceptance_02.outcome }}" "${{ steps.acceptance_02.outputs.exit_code }}"
          "test_real_api_queue_docker_results_and_checkpoint,test_real_sigkill_reconciles_and_resumes_generated_candidate_without_model_replay"
      - name: Verify frozen native final holdout without optimizer feedback
        id: acceptance_03
        if: ${{ !cancelled() && steps.acceptance_02_boundary.outcome == 'success' }}
        env:
          TRADEGRAD_REQUIRE_FINAL_INTEGRATION: "1"
          DATA_PYTHON: ${{ github.workspace }}/.venv-data/bin/python
          RESEARCH_PYTHON: ${{ github.workspace }}/.venv-research/bin/python
        run: |
          export API_PYTHON=$(command -v python)
          set +e
          .venv-research/bin/python -m pytest tests/system/test_final_pipeline.py -q --junitxml=m5-native-final-application-junit.xml
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Confirm isolated fixture teardown before the next acceptance group
        id: acceptance_03_boundary
        if: ${{ !cancelled() && steps.acceptance_03.outcome != 'skipped' }}
        run: >-
          python -m script.ci_acceptance_boundary m5-native-final-application-junit.xml
          "${{ steps.acceptance_03.outcome }}" "${{ steps.acceptance_03.outputs.exit_code }}"
          "test_real_frozen_final_result_export_and_cancelled_retry"
      - name: Verify both portable research modes, actual dual runtimes and initial-checkpoint resume
        id: acceptance_04
        if: ${{ !cancelled() && steps.acceptance_03_boundary.outcome == 'success' }}
        env:
          TRADEGRAD_REQUIRE_PORTABLE_RESEARCH_INTEGRATION: "1"
          DATA_PYTHON: ${{ github.workspace }}/.venv-data/bin/python
          RESEARCH_PYTHON: ${{ github.workspace }}/.venv-research/bin/python
        run: |
          export API_PYTHON=$(command -v python)
          set +e
          .venv-research/bin/python -m pytest tests/system/test_portable_research_pipeline.py -q --junitxml=m5-portable-application-junit.xml
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Confirm isolated fixture teardown before the next acceptance group
        id: acceptance_04_boundary
        if: ${{ !cancelled() && steps.acceptance_04.outcome != 'skipped' }}
        run: >-
          python -m script.ci_acceptance_boundary m5-portable-application-junit.xml
          "${{ steps.acceptance_04.outcome }}" "${{ steps.acceptance_04.outputs.exit_code }}"
          "test_real_portable_api_queue_both_containers_lineage_results_and_ownership"
      - name: Verify separate portable final holdout, cancellation, retries and reference export
        id: acceptance_05
        if: ${{ !cancelled() && steps.acceptance_04_boundary.outcome == 'success' }}
        env:
          TRADEGRAD_REQUIRE_PORTABLE_FINAL_INTEGRATION: "1"
          DATA_PYTHON: ${{ github.workspace }}/.venv-data/bin/python
          RESEARCH_PYTHON: ${{ github.workspace }}/.venv-research/bin/python
        run: |
          export API_PYTHON=$(command -v python)
          set +e
          .venv-research/bin/python -m pytest tests/system/test_portable_final_pipeline.py -q --junitxml=m5-portable-final-application-junit.xml
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Confirm isolated fixture teardown before the next acceptance group
        id: acceptance_05_boundary
        if: ${{ !cancelled() && steps.acceptance_05.outcome != 'skipped' }}
        run: >-
          python -m script.ci_acceptance_boundary m5-portable-final-application-junit.xml
          "${{ steps.acceptance_05.outcome }}" "${{ steps.acceptance_05.outputs.exit_code }}"
          "test_real_portable_freeze_final_reference_export_and_retry"
      - name: Owned full fixture browser acceptance or scoped live provider flows
        if: ${{ !cancelled() && steps.acceptance_05_boundary.outcome == 'success' }}
        env:
          TRADEGRAD_REQUIRE_APPLICATION_BROWSER: "1"
          TRADEGRAD_APPLICATION_STAGE: m5
        run: python -m script.ci_application_browser
      - name: Remove the disposable database
        if: always()
        run: docker rm -fv tradegrad-ci-postgres >/dev/null 2>&1 || true
      - name: Export outcome-only evidence without diagnostic payloads
        if: always()
        run: python script/summarize_ci_junit.py m1-supervisor-junit.xml m1-m2-postgres-junit.xml m2-data-contracts-junit.xml m2-live-provider-junit.xml m1-isolation-junit.xml m1-m2-process-recovery-junit.xml m3-research-contracts-junit.xml m3-window-engine-junit.xml m3-configured-application-junit.xml m5-portable-contracts-junit.xml m5-portable-calendar-junit.xml m5-portable-isolation-junit.xml m5-native-final-application-junit.xml m5-portable-application-junit.xml m5-portable-final-application-junit.xml frontend/test-results/junit.xml
      - name: Preserve bounded test evidence (no traces, credentials or source data)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m1-m5-${{ env.DATA_PROVIDER_MODE }}-validation-${{ github.sha }}
          path: var/ci-evidence/*.xml
          retention-days: 14
