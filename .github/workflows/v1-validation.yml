name: V1 staged validation

on:
  workflow_dispatch:
  push:
    branches: ["feat/webui-v1"]
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/v1-validation.yml"

permissions:
  contents: read

concurrency:
  group: v1-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: M0 four-task engine and semantics
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TRADEGRAD_WORKERS: "1"
      TRADEGRAD_DATA_WORKERS: "1"
      TRADEGRAD_LLM_WORKERS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install the frozen research baseline
        run: python -m pip install -r tests/baseline/requirements.lock
      - name: Execute actual AKQuant baseline and regression tests
        run: python -m pytest tests/baseline -q --junitxml=m0-junit.xml
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m0-validation-${{ github.sha }}
          path: m0-junit.xml
          retention-days: 14
