# Development database only. API and trusted workers run on the same Linux host
# as the Docker daemon, so input bind paths are never interpreted in two roots.
services:
  database:
    image: postgres:18.6
    environment:
      POSTGRES_DB: tradegrad
      POSTGRES_USER: tradegrad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local development database password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradegrad -d tradegrad"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
volumes:
  postgres-data:
